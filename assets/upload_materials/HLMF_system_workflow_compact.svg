  <circle cx="763" cy="700" r="94" fill="#fff" stroke="#df9a3b" stroke-width="3"/>
  <path d="M718 735 L736 697 L758 716 L779 666 L809 689" fill="none" stroke="#d97706" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="718" cy="735" r="10" fill="#d97706"/>
  <circle cx="736" cy="697" r="10" fill="#d97706"/>
  <circle cx="758" cy="716" r="10" fill="#d97706"/>
  <circle cx="779" cy="666" r="10" fill="#d97706"/>
  <circle cx="809" cy="689" r="10" fill="#d97706"/>
  <path d="M826 650 A77 77 0 0 1 837 727" fill="none" stroke="#d97706" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowOrange)"/>
  <text x="763" y="816" text-anchor="middle" class="card-title orange">TFLite Rescue</text>

  <rect x="1006" y="550" width="534" height="300" rx="28" fill="#fff7e9" stroke="#dda252" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1038" y="593" class="stage orange">07 · Train 质量门控</text>
  <path d="M1055 631 H1491 L1434 760 H1112 Z" fill="#fff" stroke="#dc9b40" stroke-width="3"/>
  <path d="M1249 760 H1297 V810 H1249 Z" fill="#f2bd70" stroke="#dc9b40" stroke-width="3"/>
  <circle cx="1140" cy="674" r="29" fill="#e4effd"/>
  <path d="M1125 675 l10 10 20-25" fill="none" stroke="#3977ae" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1180" y="682" class="card-sub">Presence</text>
  <circle cx="1346" cy="674" r="29" fill="#f0e9ff"/>
  <path d="M1332 673 H1360 M1346 659 V687" stroke="#6c55b1" stroke-width="7" stroke-linecap="round"/>
  <text x="1384" y="682" class="card-sub">Handedness</text>
  <circle cx="1140" cy="731" r="29" fill="#fff0dc"/>
  <path d="M1126 745 V717 H1154 V745" fill="none" stroke="#d97706" stroke-width="7"/>
  <text x="1180" y="739" class="card-sub">边界坐标</text>
  <circle cx="1346" cy="731" r="29" fill="#e8f7ed"/>
  <circle cx="1333" cy="738" r="6" fill="#267956"/><circle cx="1346" cy="718" r="6" fill="#267956"/><circle cx="1360" cy="740" r="6" fill="#267956"/>
  <path d="M1333 738 L1346 718 L1360 740" fill="none" stroke="#267956" stroke-width="6"/>
  <text x="1384" y="739" class="card-sub">连接长度</text>

  <!-- Divider and routing -->
  <path d="M1273 864 V910 H800 V940" class="flow-orange"/>
  <path d="M1352 492 H1560 V1000 H593" class="flow-purple dash"/>
  <text x="1524" y="930" text-anchor="end" class="small purple">Eval / Gold 进入人工复核</text>
  <path d="M583 492 V900 H994 V1000" class="flow-orange dash"/>
  <text x="622" y="927" class="small orange">Eos 低分候选</text>

  <text x="60" y="982" class="stage blue">08 · 多链路标注与发布</text>
  <rect x="60" y="1000" width="350" height="310" rx="27" fill="#eaf8f1" stroke="#79b99a" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="235" cy="1082" r="48" fill="#267956"/>
  <path d="M211 1083 l17 17 35-44" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="235" y="1161" text-anchor="middle" class="card-title green">Train 自动标注</text>
  <rect x="97" y="1190" width="276" height="51" rx="25" fill="#d7efe2"/>
  <text x="235" y="1224" text-anchor="middle" class="card-sub green">质量门控发布</text>
  <text x="235" y="1280" text-anchor="middle" class="body muted">大规模预训练数据</text>

  <rect x="430" y="1000" width="350" height="310" rx="27" fill="#f1edff" stroke="#9685cf" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="605" cy="1082" r="48" fill="#6554b4"/>
  <circle cx="591" cy="1071" r="12" fill="#fff"/>
  <path d="M568 1112 Q591 1086 614 1112" fill="#fff"/>
  <path d="M617 1084 l11 11 22-28" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="605" y="1161" text-anchor="middle" class="card-title purple">Eval / Gold</text>
  <rect x="467" y="1190" width="276" height="51" rx="25" fill="#e2daf8"/>
  <text x="605" y="1224" text-anchor="middle" class="card-sub purple">CVAT 人工复核</text>
  <text x="605" y="1280" text-anchor="middle" class="body muted">人工评估真值</text>

  <rect x="800" y="1000" width="350" height="310" rx="27" fill="#fff6e9" stroke="#dfa25a" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="975" cy="1082" r="48" fill="#d97706"/>
  <path d="M947 1071 H1003 M956 1087 H994 M967 1103 H983" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
  <text x="975" y="1161" text-anchor="middle" class="card-title orange">负样本链路</text>
  <rect x="837" y="1190" width="276" height="51" rx="25" fill="#ffe6c5"/>
  <text x="975" y="1224" text-anchor="middle" class="card-sub orange">HCF 预审 + 人审</text>
  <text x="975" y="1280" text-anchor="middle" class="body muted">高质量 no-hand</text>

  <rect x="1170" y="1000" width="370" height="310" rx="27" fill="#fff0f2" stroke="#d68a95" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="1355" cy="1082" r="48" fill="#b95666"/>
  <path d="M1327 1098 L1344 1081 L1358 1091 L1382 1058" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1327" cy="1098" r="7" fill="#fff"/><circle cx="1344" cy="1081" r="7" fill="#fff"/><circle cx="1358" cy="1091" r="7" fill="#fff"/><circle cx="1382" cy="1058" r="7" fill="#fff"/>
  <text x="1355" y="1161" text-anchor="middle" class="card-title" fill="#9e3f4f">困难样本链路</text>
  <rect x="1207" y="1190" width="296" height="51" rx="25" fill="#f8dce1"/>
  <text x="1355" y="1224" text-anchor="middle" class="card-sub" fill="#9e3f4f">挖掘 + CVAT 精修</text>
  <text x="1355" y="1280" text-anchor="middle" class="body muted">持续回流增强</text>

  <!-- Published dataset -->
  <path d="M235 1325 V1365 H800" class="flow"/>
  <path d="M605 1325 V1365 H800" class="flow-purple"/>
  <path d="M975 1325 V1365 H800" class="flow-orange"/>
  <path d="M1355 1325 V1365 H800" class="flow-purple"/>
  <rect x="190" y="1385" width="1220" height="145" rx="31" fill="#213751" filter="url(#shadow)"/>
  <g transform="translate(254 1421)">
    <ellipse cx="42" cy="14" rx="42" ry="14" fill="#8bd0e7"/>
    <rect x="0" y="14" width="84" height="52" fill="#5ca7c3"/>
    <ellipse cx="42" cy="66" rx="42" ry="14" fill="#8bd0e7"/>
