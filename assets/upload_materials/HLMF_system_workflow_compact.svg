  <text x="800" y="1445" text-anchor="middle" class="card-title white">统一发布数据集</text>
  <text x="800" y="1484" text-anchor="middle" class="card-sub white">Labels · Manifest · Registry · Provenance</text>
  <rect x="1092" y="1422" width="250" height="67" rx="33" fill="#fff"/>
  <text x="1217" y="1466" text-anchor="middle" class="card-title blue">→ Iris 训练</text>
  <text x="1510" y="1570" text-anchor="end" class="small muted">HLMF 3.0 · PPT compact edition</text>
