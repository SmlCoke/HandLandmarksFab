<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800" role="img" aria-labelledby="title desc">
  <title id="title">HLMF 3.0 完整数据标注流程</title>
  <desc id="desc">从单通道 TIFF 原图，经 Eos-2.1 Palm Detector、固定 Hand ROI、多教师关键点标注、HCF 双头分类、TFLite 几何补救与四项质量门控，分流至训练伪标签、人工评估真值、Gold、负样本和困难样本。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.55" stop-color="#f5f7ff"/>
      <stop offset="1" stop-color="#fff8f0"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b4f6c"/>
      <stop offset="1" stop-color="#166088"/>
    </linearGradient>
    <linearGradient id="teacher" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f4efff"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset="1" stop-color="#fff1dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset in="blur" dx="0" dy="6" result="offsetBlur"/>
      <feFlood flood-color="#20304a" flood-opacity="0.14" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadowBlur"/>
      <feMerge>
        <feMergeNode in="shadowBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#176b87"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#654ea3"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#d97706"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; fill: #162238; }
      .title { font-size: 54px; font-weight: 800; letter-spacing: 2px; fill: #fff; }
      .subtitle { font-size: 22px; font-weight: 500; fill: #d8eff8; }
      .section { font-size: 23px; font-weight: 800; letter-spacing: 1px; }
      .box-title { font-size: 25px; font-weight: 800; }
      .box-sub { font-size: 18px; font-weight: 700; }
      .body { font-size: 17px; font-weight: 500; }
      .small { font-size: 15px; font-weight: 500; }
      .tiny { font-size: 13px; font-weight: 500; }
      .mono { font-family: Consolas, "SFMono-Regular", monospace; }
      .white { fill: #fff; }
      .muted { fill: #59677c; }
      .teal { fill: #0f6d73; }
      .purple { fill: #5b43a3; }
      .orange { fill: #b85f00; }
      .green { fill: #207a4b; }
      .red { fill: #a83a3a; }
      .flow { fill: none; stroke: #176b87; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .flow-purple { fill: none; stroke: #654ea3; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowPurple); }
      .flow-orange { fill: none; stroke: #d97706; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowOrange); }
      .flow-gray { fill: none; stroke: #64748b; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGray); }
      .dash { stroke-dasharray: 10 9; }
      .card { fill: #fff; stroke: #cbd6e4; stroke-width: 2; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1800" height="1800" rx="36" fill="url(#bg)"/>
  <rect x="0" y="0" width="1800" height="122" rx="36" fill="url(#hero)"/>
  <rect x="0" y="86" width="1800" height="36" fill="url(#hero)"/>
  <text x="70" y="66" class="title">HLMF 3.0 · 完整数据标注流程</text>
  <text x="72" y="101" class="subtitle">多教师协同 · 模型版本校准门控 · 自动伪标签与人工 Gold 双轨闭环</text>
  <text x="1670" y="72" text-anchor="end" class="box-sub white">Iris 数据制作系统</text>

  <!-- Stage 1: source and capability contract -->
  <rect x="60" y="150" width="1680" height="188" rx="24" fill="#ecf8fb" stroke="#9acbd5" stroke-width="2"/>
  <rect x="60" y="150" width="210" height="188" rx="24" fill="#d7eff4"/>
  <rect x="240" y="150" width="30" height="188" fill="#d7eff4"/>
  <text x="86" y="187" class="section teal">01 · 原始数据入口</text>
  <text x="86" y="222" class="box-title">SC132GS 灰度图</text>
  <text x="86" y="250" class="body">1280 × 720</text>
  <text x="86" y="275" class="body">单通道 uint8</text>
  <rect x="85" y="292" width="148" height="29" rx="14" fill="#0f6d73"/>
  <text x="159" y="312" text-anchor="middle" class="small white mono">*.tif / *.tiff</text>

  <path d="M294 244 H344" class="flow"/>
  <rect x="360" y="174" width="330" height="140" rx="20" class="card"/>
  <circle cx="402" cy="216" r="20" fill="#dff4ec"/>
  <path d="M392 216 l7 7 14-17" fill="none" stroke="#21845a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="438" y="215" class="box-title">来源注册与图像检查</text>
  <text x="392" y="247" class="body">校验来源 ID / TIFF / 尺寸 / 方向</text>
  <text x="392" y="274" class="body">生成稳定 raw ID 与 Registry 记录</text>
  <text x="392" y="298" class="small muted mono">source.json · raw_images.jsonl</text>

  <path d="M707 244 H757" class="flow"/>
  <rect x="773" y="174" width="397" height="140" rx="20" class="card"/>
  <text x="805" y="211" class="box-title">Eos-2.1 距离能力门控</text>
  <rect x="805" y="230" width="105" height="34" rx="17" fill="#dff4ec" stroke="#77bd98"/>
  <text x="857" y="253" text-anchor="middle" class="body green">near ✓</text>
  <rect x="922" y="230" width="105" height="34" rx="17" fill="#dff4ec" stroke="#77bd98"/>
  <text x="974" y="253" text-anchor="middle" class="body green">mid ✓</text>
  <rect x="1039" y="230" width="105" height="34" rx="17" fill="#fff0f0" stroke="#dd9999"/>
  <text x="1091" y="253" text-anchor="middle" class="body red">far ×</text>
  <text x="805" y="292" class="small muted">far 原图保留；模型相关批处理显式跳过</text>

  <path d="M1187 244 H1237" class="flow"/>
  <rect x="1253" y="174" width="454" height="140" rx="20" class="card"/>
  <text x="1285" y="211" class="box-title">来源身份与变体隔离</text>
  <text x="1285" y="242" class="body">场景 · 距离 · 光照 · 动作 · split · session · 人员</text>
  <text x="1285" y="271" class="body">每次 proposal variant 独立；退役名称永久禁用</text>
  <text x="1285" y="298" class="small muted">避免新旧 ROI / CVAT / 标签资产混合</text>

  <!-- Stage 2: palm and ROI -->
  <text x="60" y="390" class="section teal">02 · Palm → 几何固定 Hand ROI</text>
  <rect x="60" y="414" width="380" height="250" rx="24" fill="#eaf6fa" stroke="#7bb9ca" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="60" y="414" width="380" height="50" rx="24" fill="#176b87"/>
  <rect x="60" y="442" width="380" height="22" fill="#176b87"/>
  <text x="250" y="448" text-anchor="middle" class="box-title white">Eos-2.1 · Palm Detector</text>
  <text x="88" y="498" class="body">输入：灰度 [1,1,224,384]</text>
  <text x="88" y="528" class="body">输出：bbox + p0 + p9</text>
  <text x="88" y="558" class="body">840 anchors · 全局 NMS</text>
  <text x="88" y="588" class="body">score ≥ 0.25 · NMS 0.10 · 最多 2 手</text>
  <line x1="88" y1="608" x2="412" y2="608" stroke="#a6cdd7"/>
  <text x="88" y="638" class="small teal">Palm 几何由程序产生，人工不得修改</text>

  <path d="M455 539 H515" class="flow"/>
  <rect x="531" y="414" width="400" height="250" rx="24" fill="#eff9f5" stroke="#85bca1" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="531" y="414" width="400" height="50" rx="24" fill="#267956"/>
  <rect x="531" y="442" width="400" height="22" fill="#267956"/>
  <text x="731" y="448" text-anchor="middle" class="box-title white">固定 Hand ROI</text>
  <text x="561" y="498" class="body">bbox / p0 / p9 构造旋转 ROI</text>
  <text x="561" y="528" class="body">scale 1.8 × 1.8 · shift_y −0.1</text>
  <rect x="561" y="552" width="148" height="58" rx="12" fill="#dff4ec" stroke="#77bd98"/>
  <text x="635" y="578" text-anchor="middle" class="box-sub green">256 × 256</text>
  <text x="635" y="599" text-anchor="middle" class="small green">灰度 uint8</text>
  <text x="731" y="576" class="body">无损 PNG 保存</text>
  <text x="731" y="602" class="small muted">模型读取解码后的像素数组</text>
  <text x="561" y="638" class="small green">ROI contract 与 Eos 权重版本共同校准</text>

  <!-- Low score branch -->
  <path d="M250 664 V706 H111" class="flow-orange"/>
  <rect x="60" y="722" width="401" height="132" rx="20" fill="#fff5e8" stroke="#e3a45d" stroke-width="2"/>
  <text x="88" y="758" class="box-title orange">低分候选 · 0.15 ≤ score &lt; 0.25</text>
  <text x="88" y="787" class="body">不运行 Landmark / HCF / TFLite</text>
  <text x="88" y="814" class="body">关键点为空 · handedness unknown</text>
  <text x="88" y="839" class="small orange mono">→ candidate_negatives.jsonl</text>

  <!-- Stage 3 teachers -->
  <text x="980" y="390" class="section purple">03 · 多教师关键点标注（21 点）</text>
  <rect x="971" y="414" width="769" height="440" rx="26" fill="url(#teacher)" stroke="#a99bd0" stroke-width="2.5" filter="url(#shadow)"/>
  <path d="M947 539 H971" class="flow"/>
  <text x="1003" y="452" class="box-sub purple">同一 ROI，可按 proposal variant 显式选择后端</text>

  <rect x="1003" y="474" width="456" height="103" rx="18" fill="#fff" stroke="#8f80c3" stroke-width="2"/>
  <rect x="1003" y="474" width="118" height="103" rx="18" fill="#654ea3"/>
  <rect x="1093" y="474" width="28" height="103" fill="#654ea3"/>
  <text x="1062" y="513" text-anchor="middle" class="box-sub white">默认</text>
  <text x="1062" y="541" text-anchor="middle" class="body white">RTMPose</text>
  <text x="1062" y="563" text-anchor="middle" class="tiny white">m-Hand5</text>
  <text x="1145" y="511" class="body">SimCC logits argmax ÷ 2.0</text>
  <text x="1145" y="540" class="body">固定 CPU · batch 64</text>
  <text x="1145" y="565" class="small muted">输出 21 个 ROI 像素坐标</text>

  <rect x="1003" y="592" width="456" height="103" rx="18" fill="#fff" stroke="#4aa6a1" stroke-width="2"/>
  <rect x="1003" y="592" width="118" height="103" rx="18" fill="#258b86"/>
  <rect x="1093" y="592" width="28" height="103" fill="#258b86"/>
  <text x="1062" y="628" text-anchor="middle" class="box-sub white">覆盖 A</text>
  <text x="1062" y="656" text-anchor="middle" class="body white">MediaPipe</text>
  <text x="1062" y="679" text-anchor="middle" class="tiny white">Tasks</text>
  <text x="1145" y="630" class="body">独立显式教师后端</text>
  <text x="1145" y="659" class="body">关键点 + presence / handedness</text>
  <text x="1145" y="684" class="small muted">不应用 runtime 三项门控</text>

  <rect x="1003" y="710" width="456" height="103" rx="18" fill="#fff" stroke="#9c6ab4" stroke-width="2"/>
  <rect x="1003" y="710" width="118" height="103" rx="18" fill="#87509f"/>
  <rect x="1093" y="710" width="28" height="103" fill="#87509f"/>
  <text x="1062" y="746" text-anchor="middle" class="box-sub white">覆盖 B</text>
  <text x="1062" y="775" text-anchor="middle" class="body white">HaMeR</text>
  <text x="1062" y="797" text-anchor="middle" class="tiny white">CVPR24</text>
  <text x="1145" y="748" class="body">MANO 回归 · rescale 0.75 · CUDA</text>
  <text x="1145" y="777" class="body">HCF Left / Right 决定翻转</text>
  <text x="1145" y="802" class="small muted">只消费 2D 21 点，不消费 3D 输出</text>

  <path d="M1475 525 H1508" class="flow-purple"/>
  <path d="M1475 761 H1508" class="flow-purple"/>
  <rect x="1523" y="500" width="184" height="287" rx="20" fill="#fff" stroke="#668bb5" stroke-width="2.5"/>
  <text x="1615" y="538" text-anchor="middle" class="box-title" fill="#315f8b">双头 HCF</text>
  <text x="1615" y="566" text-anchor="middle" class="small muted">v1 MobileNetV3-Large</text>
  <rect x="1547" y="593" width="136" height="64" rx="14" fill="#e9f3ff" stroke="#87add2"/>
  <text x="1615" y="619" text-anchor="middle" class="box-sub">Presence</text>
  <text x="1615" y="643" text-anchor="middle" class="small">P(has_hand)</text>
  <rect x="1547" y="672" width="136" height="64" rx="14" fill="#f2ecff" stroke="#ad93d2"/>
  <text x="1615" y="698" text-anchor="middle" class="box-sub">Handedness</text>
  <text x="1615" y="722" text-anchor="middle" class="small">Left / Right</text>
  <text x="1615" y="762" text-anchor="middle" class="tiny muted">RTMPose / HaMeR 唯一</text>
  <text x="1615" y="779" text-anchor="middle" class="tiny muted">置信度教师</text>

  <!-- Stage 4 rescue and gate -->
  <text x="510" y="900" class="section orange">04 · 几何补救 + 四项质量门控</text>
  <rect x="510" y="924" width="1230" height="312" rx="26" fill="url(#gate)" stroke="#e3a45d" stroke-width="2.5" filter="url(#shadow)"/>
  <path d="M1355 854 V888 H1125 V924" class="flow-purple"/>
  <text x="1377" y="886" class="tiny purple">仅 RTMPose / HaMeR 几何预检失败时</text>

  <rect x="540" y="954" width="326" height="248" rx="20" fill="#fff" stroke="#e3a45d" stroke-width="2"/>
  <text x="703" y="990" text-anchor="middle" class="box-title orange">TFLite 几何补救</text>
  <text x="703" y="1018" text-anchor="middle" class="small muted">MediaPipe Hand Landmark Full</text>
  <path d="M574 1051 H832" stroke="#e9bf8e" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="574" y="1081" class="body">触发：边界 / 连接长度预检失败</text>
  <text x="574" y="1110" class="body">重预测 21 点并复检两项几何</text>
  <text x="574" y="1139" class="body">通过才替换原教师关键点</text>
  <text x="574" y="1170" class="small orange">不是第五条门控</text>
  <text x="574" y="1191" class="tiny muted">HCF presence / handedness 始终保留</text>

  <path d="M882 1078 H918" class="flow-orange"/>
  <rect x="934" y="954" width="776" height="248" rx="20" fill="#fff" stroke="#d49b4d" stroke-width="2"/>
  <text x="966" y="990" class="box-title orange">Train 发布门控</text>
  <text x="1677" y="990" text-anchor="end" class="small muted">失败 → ignored.jsonl</text>

  <rect x="966" y="1015" width="345" height="72" rx="14" fill="#fff7e8" stroke="#e3b360"/>
  <circle cx="994" cy="1051" r="17" fill="#d97706"/>
  <text x="994" y="1057" text-anchor="middle" class="body white">1</text>
  <text x="1022" y="1044" class="box-sub">Hand presence</text>
  <text x="1022" y="1068" class="small">RTMPose / HaMeR：P(has_hand) ≥ 0.5</text>

  <rect x="1331" y="1015" width="347" height="72" rx="14" fill="#fff7e8" stroke="#e3b360"/>
  <circle cx="1359" cy="1051" r="17" fill="#d97706"/>
  <text x="1359" y="1057" text-anchor="middle" class="body white">2</text>
  <text x="1387" y="1044" class="box-sub">边界坐标</text>
  <text x="1387" y="1068" class="small">RTMPose / HaMeR：0 / 255 坐标值 &lt; 2</text>

  <rect x="966" y="1102" width="345" height="72" rx="14" fill="#fff7e8" stroke="#e3b360"/>
  <circle cx="994" cy="1138" r="17" fill="#d97706"/>
  <text x="994" y="1144" text-anchor="middle" class="body white">3</text>
  <text x="1022" y="1131" class="box-sub">连接长度</text>
  <text x="1022" y="1155" class="small">RTMPose / HaMeR：20 对 · 距离独立阈值</text>

  <rect x="1331" y="1102" width="347" height="72" rx="14" fill="#fff7e8" stroke="#e3b360"/>
  <circle cx="1359" cy="1138" r="17" fill="#d97706"/>
  <text x="1359" y="1144" text-anchor="middle" class="body white">4</text>
  <text x="1387" y="1131" class="box-sub">Handedness</text>
  <text x="1387" y="1155" class="small">所有 Train positive：score ≥ 0.8</text>

  <!-- Stage 5 routing -->
  <text x="60" y="1285" class="section teal">05 · 按数据用途分流：自动发布、人审真值与持续回流</text>

  <path d="M1320 1236 V1270 H289 V1310" class="flow"/>
  <path d="M1707 820 H1760 V1280 H805 V1310" class="flow-purple dash"/>
  <text x="1748" y="1260" text-anchor="end" class="tiny purple">Eval / Gold 绕过 Train 门控，直接进入人工复核</text>
  <path d="M260 854 V1262 H1320 V1310" class="flow-orange dash"/>

  <rect x="60" y="1310" width="440" height="317" rx="24" fill="#ecf8f3" stroke="#77b996" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="60" y="1310" width="440" height="54" rx="24" fill="#267956"/>
  <rect x="60" y="1340" width="440" height="24" fill="#267956"/>
  <text x="280" y="1347" text-anchor="middle" class="box-title white">A · Train 自动伪标签链路</text>
  <text x="91" y="1404" class="body">四项门控通过</text>
  <path d="M95 1424 H465" stroke="#a5cdb7"/>
  <text x="91" y="1454" class="box-sub green mono">hand_training_labels.jsonl</text>
  <text x="91" y="1482" class="body">→ PretrainSource · geometry 预训练</text>
  <rect x="91" y="1510" width="378" height="79" rx="14" fill="#fff" stroke="#a6cbb7"/>
  <text x="110" y="1540" class="small">自动 positive + 独立 candidate + ignored</text>
  <text x="110" y="1567" class="small muted">完整 provenance / QC / 互斥门控统计</text>
  <text x="91" y="1611" class="tiny muted">教师输出是伪标签，不等同于人工评估真值</text>

  <rect x="525" y="1310" width="560" height="317" rx="24" fill="#f2effb" stroke="#9b89c7" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="525" y="1310" width="560" height="54" rx="24" fill="#654ea3"/>
  <rect x="525" y="1340" width="560" height="24" fill="#654ea3"/>
  <text x="805" y="1347" text-anchor="middle" class="box-title white">B · Eval / 新录制 Gold 人工真值链路</text>
  <text x="558" y="1404" class="body">自动草标 + ROI 图像</text>
  <path d="M558 1428 H1050" stroke="#b9abd8"/>
  <rect x="558" y="1450" width="211" height="89" rx="14" fill="#fff" stroke="#aa97cf"/>
  <text x="663" y="1482" text-anchor="middle" class="box-sub purple">CVAT 1.1 人工复核</text>
  <text x="663" y="1509" text-anchor="middle" class="small">21 点 · 手性 · 有无手 · ignore</text>
  <path d="M786 1494 H819" class="flow-purple"/>
  <rect x="835" y="1450" width="217" height="89" rx="14" fill="#fff" stroke="#aa97cf"/>
  <text x="943" y="1481" text-anchor="middle" class="box-sub purple">严格导入 + 发布</text>
  <text x="943" y="1508" text-anchor="middle" class="small">禁止修改 Palm / ROI</text>
  <text x="558" y="1571" class="small mono purple">Val / Test → hand_evaluation_labels.jsonl</text>
  <text x="558" y="1598" class="small mono purple">Recorded Gold → hand_gold_labels.jsonl</text>

  <rect x="1110" y="1310" width="630" height="317" rx="24" fill="#fff5e8" stroke="#e1a35c" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="1110" y="1310" width="630" height="54" rx="24" fill="#c96f12"/>
  <rect x="1110" y="1340" width="630" height="24" fill="#c96f12"/>
