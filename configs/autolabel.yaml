task: autolabel
schema_version: hlmf_autolabel_v1

dataset:
  role: train

paths:
  # Source-local output paths are injected by scripts/hlmf.py.
  images_dir: data/images
  palm_outputs_dir: data/01_palm/eos-1.0
  roi_crops_dir: data/02_roi_crops/eos-1.0
  reviewed_dir: data/03_reviewed/eos-1.0
  labels_dir: data/05_labels/eos-1.0
  qc_dir: data/qc/eos-1.0
  palm_model_onnx: models/palm_detector/eos-1.0/model_opt.onnx

image:
  width: 1280
  height: 720
  channels: 1
  orientation: upright
  accepted_extensions: [.tif, .tiff]

palm:
  backend: aethersign_onnx
  input_size: 224
  score_threshold: 0.50
  nms_iou_threshold: 0.30
  cross_head_suppress_iou: 0.35
  max_detections: 2
  keep_low_score_candidates_for_negatives: true
  negative_candidate_threshold: 0.15
  compatible_bbox_expand: 0.25
  mediapipe_official_full_image_first: false
  mediapipe_official_tile_sizes: [512]
  mediapipe_official_tile_overlap: 0.5

hand_roi:
  output_width: 256
  output_height: 256
  scale_x: 1.8
  scale_y: 1.8
  shift_x: 0.0
  shift_y: -0.1

hand_landmark:
  backend: mediapipe_tasks

mediapipe:
  model_asset_path: models/mediapipe/hand_landmarker.task
  num_hands: 1
  min_hand_detection_confidence: 0.5
  min_hand_presence_confidence: 0.5
  min_tracking_confidence: 0.5

rtmpose:
  model_onnx_path: models/rtmpose/rtmpose-m_hand5_256x256.onnx
  simcc_split_ratio: 2.0

quality:
  handedness_review_threshold: 0.7
  high_palm_score_review_threshold: 0.8

visualization:
  # Global Hand ROI default. Override one high-level run with ROI_VISUALIZATION=true/false.
  roi_enabled: false
  # Draw projected landmarks on every original image, grouped by proposal variant.
  original_image_enabled: false
  # Train uses a deterministic, evenly spaced sample; Val/Test always render all ROIs.
  train_max_samples: 200
