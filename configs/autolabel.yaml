task: autolabel
schema_version: hlmf_autolabel_v1

dataset:
  role: train

paths:
  # Source-local output paths are injected by scripts/hlmf.py.
  images_dir: data/images
  palm_outputs_dir: data/01_palm/eos-2.0
  roi_crops_dir: data/02_roi_crops/eos-2.0
  reviewed_dir: data/03_reviewed/eos-2.0
  labels_dir: data/05_labels/eos-2.0
  qc_dir: data/qc/eos-2.0
  palm_model_onnx: models/palm_detector/eos-2.0/model_384x224_opt.onnx

onnx_runtime:
  # auto prefers CUDAExecutionProvider and falls back to CPU when CUDA is unavailable.
  provider: auto
  # Per-model overrides are chosen from server CPU/GPU benchmarks.
  model_providers:
    palm: auto
    # GPU changed decoded keypoints and slightly reduced reviewed-Eval accuracy.
    rtmpose: cpu
    hand_classifier: auto
  # RTMPose and Hand Classifier use this dynamic batch size; Palm is fixed at batch 1.
  batch_size: 64

image:
  width: 1280
  height: 720
  channels: 1
  orientation: upright
  accepted_extensions: [.tif, .tiff]

palm:
  backend: aethersign_onnx
  model_id: eos-2.0
  # Eos-2.0 was trained for near/mid only; far must not enter its annotation chain.
  supported_capture_distances: [near, mid]
  input_width: 384
  input_height: 224
  onnx_output_layout: nchw
  feature_levels:
    - name: 14x24
      height: 14
      width: 24
      anchor_sizes:
        - [0.1188828125, 0.2170138889]
        - [0.129875, 0.34175]
    - name: 7x12
      height: 7
      width: 12
      anchor_sizes:
        - [0.171640625, 0.2737222222]
        - [0.193296875, 0.4076527778]
  score_threshold: 0.25
  nms_iou_threshold: 0.10
  max_detections: 2
  keep_low_score_candidates_for_negatives: true
  negative_candidate_threshold: 0.15
  compatible_bbox_expand: 0.25
  mediapipe_official_full_image_first: false
  mediapipe_official_tile_sizes: [512]
  mediapipe_official_tile_overlap: 0.5

hand_roi:
  output_width: 256
  output_height: 256
  scale_x: 1.8
  scale_y: 1.8
  shift_x: 0.0
  shift_y: -0.1

hand_landmark:
  backend: mediapipe_tasks

mediapipe:
  model_asset_path: models/mediapipe/hand_landmarker.task
  num_hands: 1
  min_hand_detection_confidence: 0.5
  min_hand_presence_confidence: 0.5
  min_tracking_confidence: 0.5

rtmpose:
  model_onnx_path: models/rtmpose/rtmpose-m_hand5_256x256.onnx
  simcc_split_ratio: 2.0

mediapipe_tflite:
  model_asset_path: models/mediapipe/hand_landmarker_tflite/hand_landmark_full.tflite
  python_executable: "${HLMF_MEDIAPIPE_TFLITE_PYTHON:-/root/miniconda3/envs/hlmf-mp-tflite/bin/python}"

hand_classifier:
  model_onnx_path: models/hand_classifier/handedness-handpresence-0809/model.onnx

negative_review:
  # Only candidates with P(has_hand) strictly below this value enter manual review.
  hand_presence_threshold: 0.5

quality:
  handedness_review_threshold: 0.7
  # P(has_hand); derived from 7,907 human-reviewed FullEnhanceVal0801 ROIs.
  rtmpose_train_hand_presence_threshold: 0.025
  rtmpose_train_boundary_coordinate_reject_threshold: 2
  # Retry RTMPose Train rows that fail a geometry gate with the landmark-only TFLite model.
  rtmpose_train_mediapipe_tflite_rescue_enabled: true
  # Strictly greater than one of these crop-pixel limits rejects an RTMPose Train runtime row.
  rtmpose_train_connection_length_gate_enabled: true
  rtmpose_train_connection_length_thresholds_px:
    near:
      "0-1": 139
      "1-2": 88
      "2-3": 65
      "3-4": 70
      "0-5": 180
      "5-6": 99
      "6-7": 53
      "7-8": 50
      "0-9": 169
      "9-10": 112
      "10-11": 62
      "11-12": 54
      "0-13": 157
      "13-14": 108
      "14-15": 70
      "15-16": 61
      "0-17": 146
      "17-18": 84
      "18-19": 44
      "19-20": 52
    mid:
      "0-1": 85
      "1-2": 74
      "2-3": 60
      "3-4": 62
      "0-5": 146
      "5-6": 72
      "6-7": 48
      "7-8": 39
      "0-9": 140
