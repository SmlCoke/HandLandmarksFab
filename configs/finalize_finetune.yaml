schema_version: hmlf_gold_finalize_v1
workspace_root: ${HAND_WORK_ROOT}/finetune/${HAND_FINETUNE_ID}

source_discovery:
  root: ${HAND_GOLD_ROOT}
  descriptor_name: finetune_source.json
  layout: domain_batch_published_v1

cross_source_identity:
  keys: [parent_global_crop_id, global_crop_id, image_sha256, normalized_pixel_sha256]
  conflicting_label: fail
  identical_label: keep_by_role_then_source_id
  role_precedence: [external_gold, reviewed_hard_gold, disagreement_gold, new_recorded_gold]

outputs:
  root: ${HAND_WORK_ROOT}/finetune/${HAND_FINETUNE_ID}/hmlf_gold_merged
