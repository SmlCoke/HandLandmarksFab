dataset:
  id: peak_route_merged_val_v1
  split: val

evaluation:
  require_palm_valid: true
  check_crop_images: true
  minimum_included: 1

sources:
  # Peak 和 Soar 的 shared Val 是互补 source；不要手工拼接 JSONL。
  - source_id: peak_vals_shared
    dataset_id: peak_vals_shared_v1
    owner: Peak
    partition: shared
    root: ${HAND_DATA_ROOT:../autodl-tmp/eval_sources}/peak_vals
    crop_images_dir: 02_roi_crops/images
    manifest: 02_roi_crops/hand_roi_crops_manifest.jsonl
    reviewed: 03_reviewed/hand_landmarks_reviewed.jsonl
    import_report: qc/cvat_import_stats.json
    review_context: 03_reviewed/review_context.csv

  - source_id: soar_vals_shared
    dataset_id: soar_vals_shared_v1
    owner: Soar
    partition: shared
    root: ${HAND_DATA_ROOT:../autodl-tmp/eval_sources}/soar_vals
    crop_images_dir: 02_roi_crops/images
    manifest: 02_roi_crops/hand_roi_crops_manifest.jsonl
    reviewed: 03_reviewed/hand_landmarks_reviewed.jsonl
    import_report: qc/cvat_import_stats.json
    review_context: 03_reviewed/review_context.csv

  # 当前配置用于 Peak 路线，因此 independent 部分选择 Peak 自己的 vali_data。
  - source_id: peak_vali_independent
    dataset_id: peak_vali_independent_v1
    owner: Peak
    partition: independent
    root: ${HAND_DATA_ROOT:../autodl-tmp/eval_sources}/peak_vali
    crop_images_dir: 02_roi_crops/images
    manifest: 02_roi_crops/hand_roi_crops_manifest.jsonl
    reviewed: 03_reviewed/hand_landmarks_reviewed.jsonl
    import_report: qc/cvat_import_stats.json
    review_context: 03_reviewed/review_context.csv

outputs:
  labels_dir: ${HAND_DATA_ROOT:../autodl-tmp}/val_merged/05_labels
  qc_dir: ${HAND_DATA_ROOT:../autodl-tmp}/val_merged/qc
