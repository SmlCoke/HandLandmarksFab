schema_version: train_finalize_v1

# 每份数据使用独立 dataset_id。队友的数据请复制下面条目并修改路径，不能复用 dataset_id。
sources:
  - dataset_id: peak_train_v1
    contributor: Peak
    root: ${HAND_DATA_ROOT:-/root/autodl-tmp}
    manifest: peak_train_data/02_roi_crops/hand_roi_crops_manifest.jsonl
    pseudo_labels: peak_train_data/02_roi_crops/hand_landmarks_autolabel_draft.jsonl
    # 数据目录移动后 manifest 中可能仍是旧 crop_path；显式目录按 basename 重定位真实图片。
    # 最后输出 json 中的 source_crop_path 是 manifest 中的旧路径，对应数据搬移前。crop_path 才是现在的真实图片路径
    crop_images_dir: peak_train_data/02_roi_crops/images
    # 有人工精标子集后再启用；同 crop_id 的 Gold 会先覆盖 pseudo。
    # gold_labels: peak_train_data/03_reviewed/hand_landmarks_reviewed.jsonl

  - dataset_id: soar_train_v1
    contributor: Soar
    root: ${HAND_DATA_ROOT:-/root/autodl-tmp}
    manifest: soar_train_data/02_roi_crops/hand_roi_crops_manifest.jsonl
    pseudo_labels: soar_train_data/02_roi_crops/hand_landmarks_autolabel_draft.jsonl
    crop_images_dir: soar_train_data/02_roi_crops/images

validation:
  check_crop_images: true

# 07A 的质量分层阈值属于 finalize 策略，不再从 autolabel 配置间接读取。
quality:
  handedness_review_threshold: 0.7
  high_palm_score_review_threshold: 0.8

dedup:
  positive_normalized_distance: 0.18
  max_positive_representatives_per_cluster: 1
  negative_roi_iou: 0.85
  negative_positive_overlap_iou: 0.70
  max_negatives_per_type_per_image: 1

stages:
  pretrain:
    supervision_loss_weights: {pseudo: 0.7, gold: 1.0}
    quality_loss_weights: {HIGH: 1.0, MEDIUM: 0.7, PRESENCE_ONLY: 0.4, AMBIGUOUS: 0.0, INVALID: 0.0}
    sampling_weights: {POS_RUNTIME: 0.70, POS_LOW_PALM: 0.70, NEG_RUNTIME_CANDIDATE: 0.25, NEG_LOW_PALM_CANDIDATE: 0.05}
  finetune:
    supervision_loss_weights: {pseudo: 0.5, gold: 1.0}
    quality_loss_weights: {HIGH: 1.0, MEDIUM: 0.6, PRESENCE_ONLY: 0.3, AMBIGUOUS: 0.0, INVALID: 0.0}
    sampling_weights: {POS_RUNTIME: 0.70, POS_LOW_PALM: 0.70, NEG_RUNTIME_CANDIDATE: 0.25, NEG_LOW_PALM_CANDIDATE: 0.05}

outputs:
  pretrain:
    labels_dir: ${HAND_DATA_ROOT:-/root/autodl-tmp}/train_pretrain_merged/05_labels
    qc_dir: ${HAND_DATA_ROOT:-/root/autodl-tmp}/train_pretrain_merged/qc
  finetune:
    labels_dir: ${HAND_DATA_ROOT:-/root/autodl-tmp}/train_finetune_merged/05_labels
    qc_dir: ${HAND_DATA_ROOT:-/root/autodl-tmp}/train_finetune_merged/qc
